[package]
name = "chrono-harness-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[test]]
name = "source_coverage"
path = "tests/source_coverage.rs"

[[test]]
name = "runtime_logging"
path = "tests/runtime_logging.rs"

[dependencies]
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
chrono-test-process.workspace = true
verus_builtin_macros.workspace = true
serde.workspace = true
sha1.workspace = true
serde_json.workspace = true
libc.workspace = true
sha2.workspace = true
chrono-harness = { workspace = true, features = ["retention-test"] }

[dev-dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
tempfile.workspace = true

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false

[[test]]
name = "cli_contract"
path = "tests/cli_contract.rs"

[[test]]
name = "protocol_v1"
path = "tests/protocol_v1.rs"

[[test]]
name = "registry_snapshot"
path = "tests/registry_snapshot.rs"

[[test]]
name = "git_inputs"
path = "tests/git_inputs.rs"

[[test]]
name = "verified_git_binding"
path = "tests/verified_git_binding.rs"


[[test]]
name = "process_fds"
path = "tests/process_fds.rs"

[[bin]]
name = "chrono-test-process-lifecycle"
path = "tests/support/process_lifecycle.rs"
test = false
bench = false

