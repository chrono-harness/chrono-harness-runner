[package]
name = "chrono-harness"
version = "0.1.23"
edition = "2024"
publish = false
description = "External judge transport and canonical harness check entry"

[features]
retention-test = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "chrono-harness"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-identifiers.workspace = true
chrono-verifier.workspace = true
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
rustix = {version = "1", features = ["net"]}
tracing.workspace = true
tracing-tunnel = { version = "=0.1.0", default-features = false, features = ["sender"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sha1.workspace = true
libc.workspace = true
serde_jcs = "=0.4.0"
serde-content = { version = "=0.1.2", default-features = false, features = ["serde", "std"] }
tempfile.workspace = true
miniz_oxide = "=0.9.1"
verus_builtin_macros.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
