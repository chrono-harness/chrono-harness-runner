[package]
name = "chrono-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "External judge transport and canonical harness check entry"

[features]
retention-test = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "chrono-harness"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-identifiers = { path = "../proofs/identifiers" }
chrono-verifier = { path = "../proofs/verifier" }
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
rustix = {version = "1", features = ["net"]}
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-tunnel = { version = "=0.1.0", default-features = false, features = ["sender"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sha1 = "0.10"
libc = "=0.2.189"
serde_jcs = "=0.2.0"
tempfile = "3"
miniz_oxide = "=0.8.9"
verus_builtin_macros = "=0.0.0-2026-04-20-1748"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# Full unit/collection checks repeatedly serialize the original judge evidence.
# Keep that work optimized in the registered development build too.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
