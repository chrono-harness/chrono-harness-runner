[package]
name = "chrono-verifier"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }

[dependencies]
chrono-identifiers.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
verus_builtin_macros.workspace = true
vstd.workspace = true
