name: check
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install_args: http:chrono-harness http:chrono-host-bootstrap http:chrono-judge-ci http:verus http:chrono-test-git http:chrono-test-git-profile
      - name: Check this change with the released and candidate harness
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1)
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          else
            base=$BEFORE
          fi
          released=$(mise which chrono-harness)
          judge=$(mise which chrono-judge-ci)
          verifier=$(mise which verus)
          mkdir -p target
          target=$(mktemp -d "$PWD/target/runner-self.XXXXXXXX")
          trap 'rm -rf -- "$target"' EXIT
          check_change() {
            env -i HOME="$HOME" PATH="$(dirname "$judge"):$PATH" TMPDIR="$TMPDIR" \
              VERUS="$verifier" CARGO_TARGET_DIR="$target" \
              "$1" check --config .chrono-harness/check.json --base "$base" --candidate "$candidate" > "$RUNNER_TEMP/check-output.json"
          }
          check_change "$released"
          jq '{status: .response.status, results: .response.results}' .chrono-harness/state/check.json
          if jq -e '.response.status == "passed" and any(.response.results[]; .id == "runner.verify" and .status == "passed")' .chrono-harness/state/check.json >/dev/null; then
            check_change "$target/debug/chrono-harness"
            jq '{status: .response.status, results: .response.results}' .chrono-harness/state/check.json
          fi
          if jq -e 'any(.response.results[]; (.id == "verify.shallow-reads" or .id == "verify.shallow-reads-tests" or .id == "verify.resource-limits" or .id == "verify.resource-limits-tests" or .id == "verify.sealed-member" or .id == "verify.sealed-member-tests") and .status == "passed")' .chrono-harness/state/check.json >/dev/null ||
             ! git diff --quiet "$base" "$candidate" -- crates/runner/src/prepared.rs crates/runner/src/verified_git_binding.rs crates/runner-tests/tests/verified_git_binding.rs \
                crates/runner/src/retained_artifacts/session/publication.rs crates/runner/src/retained_artifacts/verified_release.rs crates/runner-tests/tests/verified_release.rs; then
            echo 'RUNNER_CHECK_RECEIPTS=true' >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() || env.RUNNER_CHECK_RECEIPTS == 'true'
        with:
          name: runner-check
          path: |
            .chrono-harness/state/check.json
            .chrono-harness/state/*.operation-*/stdout
            .chrono-harness/state/*.operation-*/stderr
            .chrono-harness/state/*.operation-*/*.json
          include-hidden-files: true
          retention-days: 1
