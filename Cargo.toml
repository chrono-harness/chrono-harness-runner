[workspace]
members = [
    "crates/runner",
    "crates/runner-tests",
    "crates/test-process",
    "crates/proofs/identifiers",
    "crates/proofs/verifier",
    "crates/proofs/expectations",
]
default-members = ["crates/runner"]
resolver = "3"

[workspace.dependencies]
chrono-harness = { path = "crates/runner" }
chrono-test-process = { path = "crates/test-process" }
chrono-identifiers = { path = "crates/proofs/identifiers" }
chrono-verifier = { path = "crates/proofs/verifier" }
libc = "=0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
vstd = "=0.0.0-2026-04-20-1748"

# The runner and its finite retention tests repeatedly serialize original evidence.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
